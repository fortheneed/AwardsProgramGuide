# Netlify reads this file instead of the build settings in the dashboard.
[build]
  publish = "public"
  functions = "netlify/functions"
  # No build step: the site is plain files.

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/awards.json"
  [headers.values]
    Cache-Control = "no-cache"
